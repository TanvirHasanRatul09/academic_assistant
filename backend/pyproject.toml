[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "academic-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the Personal Academic Intelligence Assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.14.2,<5",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
incremental = false
plugins = ["pydantic.mypy"]

